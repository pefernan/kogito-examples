server.address=0.0.0.0

kogito.service.url=http://0.0.0.0:8080
kogito.jobs-service.url=http://0.0.0.0:8080
kogito.data-index.url=http://0.0.0.0:8080
kogito.dataindex.http.url=http://0.0.0.0:8080

#run create tables scripts during the application startup
kie.flyway.enabled=true

#Disabling Spring-Boot Flyway to avoid unnecessary Data Base initialization
spring.flyway.enabled=false

#jdbc
kogito.persistence.type=jdbc
spring.datasource.url=jdbc:postgresql://localhost:5432/kogito?stringtype=unspecified
spring.datasource.username=kogito-user
spring.datasource.password=kogito-pass

spring.graphql.graphiql.enabled=true
